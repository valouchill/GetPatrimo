services:
  getpatrimo:
    build: .
    container_name: getpatrimo-app
    # Sécurité (pentest ChatGPT) : binder UNIQUEMENT sur localhost — nginx-proxy-manager
    # atteint l'app par le réseau doc2loc-net (getpatrimo-app:3000), pas par le port hôte.
    # Évite l'exposition publique de :3000 (contournement TLS/edge).
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      # MongoDB depuis Docker : utilise le nom du service ou l'IP de l'hôte
      - MONGO_URI=${MONGO_URI}
    volumes:
      # V1: persistance pour uploads et fichiers générés (passeports, etc.)
      - ./uploads:/opt/doc2loc/uploads
      # .env en lecture seule
      - ./.env:/opt/doc2loc/.env:ro
      # NB: on n'écrase plus le code (.next/app/lib/...) — l'image contient le build de production
    networks:
      doc2loc-net:
        aliases:
          - doc2loc
          - getpatrimo
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  doc2loc-net:
    external: true
